plugins {
    id 'dev.architectury.loom'
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'veil_iris_lights-refmap.json'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }

    // Mixin + net.fabricmc.api (EnvType etc.) — provided by fabric-loader; needed for common compilation
    modCompileOnly("net.fabricmc:fabric-loader:${fabric_loader_version}")

    // Iris — NeoForge artifact used as compile-only reference; Fabric artifact used at runtime in fabric subproject
    modCompileOnly("maven.modrinth:iris:${iris_version}-neoforge") { transitive = false }

    // Veil — common artifact provides the cross-loader API surface
    modCompileOnly("foundry.veil:veil-common-${minecraft_version}:${veil_version}") {
        exclude group: 'maven.modrinth'
        exclude group: 'me.fallenbreath'
        transitive = false
    }
}
